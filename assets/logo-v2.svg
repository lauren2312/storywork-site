<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="StoryWork logo">
  <g fill="none" stroke="#A89373" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Square 1 (axis-aligned), drawn as 4 segments with small gaps at corners -->
    <line x1="30" y1="20" x2="170" y2="20"/>
    <line x1="180" y1="30" x2="180" y2="170"/>
    <line x1="170" y1="180" x2="30" y2="180"/>
    <line x1="20" y1="170" x2="20" y2="30"/>
    <!-- Square 2 (rotated 45 deg), 4 segments with gaps at corners -->
    <line x1="107" y1="22" x2="178" y2="93"/>
    <line x1="178" y1="107" x2="107" y2="178"/>
    <line x1="93" y1="178" x2="22" y2="107"/>
    <line x1="22" y1="93" x2="93" y2="22"/>
  </g>
  <text x="100" y="118" text-anchor="middle"
        font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif"
        font-size="56" font-weight="500"
        fill="#0E4F56">SW</text>
</svg>
