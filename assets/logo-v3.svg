<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="StoryWork logo">
  <!-- 8-point star: two overlapping squares with woven breaks at crossings -->
  <!-- Square 1 (axis-aligned), corners at (37,37) to (163,163). Side ~126. -->
  <!-- Square 2 (rotated 45°) tips at (100,10), (190,100), (100,190), (10,100). -->
  <!-- Crossings of square 1 edges with square 2 lines: at offsets ~36 from each corner -->
  <g fill="none" stroke="#A89373" stroke-width="2.2" stroke-linecap="butt">
    <!-- ============ SQUARE 1 (axis-aligned), with breaks ============ -->
    <!-- Top edge: from (37,37) to (163,37), breaks at (73,37) and (127,37) -->
    <line x1="37" y1="37" x2="71" y2="37"/>
    <line x1="75" y1="37" x2="125" y2="37"/>
    <line x1="129" y1="37" x2="163" y2="37"/>
    <!-- Right edge: from (163,37) to (163,163), breaks at (163,73) and (163,127) -->
    <line x1="163" y1="37" x2="163" y2="71"/>
    <line x1="163" y1="75" x2="163" y2="125"/>
    <line x1="163" y1="129" x2="163" y2="163"/>
    <!-- Bottom edge: from (163,163) to (37,163), breaks at (127,163) and (73,163) -->
    <line x1="163" y1="163" x2="129" y2="163"/>
    <line x1="125" y1="163" x2="75" y2="163"/>
    <line x1="71" y1="163" x2="37" y2="163"/>
    <!-- Left edge: from (37,163) to (37,37), breaks at (37,127) and (37,73) -->
    <line x1="37" y1="163" x2="37" y2="129"/>
    <line x1="37" y1="125" x2="37" y2="75"/>
    <line x1="37" y1="71" x2="37" y2="37"/>

    <!-- ============ SQUARE 2 (rotated 45°), with breaks ============ -->
    <!-- Top-right edge: from (100,10) to (190,100). Crossings at (127,37) and (163,73) -->
    <line x1="100" y1="10" x2="125" y2="35"/>
    <line x1="129" y1="39" x2="161" y2="71"/>
    <line x1="165" y1="75" x2="190" y2="100"/>
    <!-- Bottom-right edge: (190,100) to (100,190). Crossings at (163,127) and (127,163) -->
    <line x1="190" y1="100" x2="165" y2="125"/>
    <line x1="161" y1="129" x2="129" y2="161"/>
    <line x1="125" y1="165" x2="100" y2="190"/>
    <!-- Bottom-left edge: (100,190) to (10,100). Crossings at (73,163) and (37,127) -->
    <line x1="100" y1="190" x2="75" y2="165"/>
    <line x1="71" y1="161" x2="39" y2="129"/>
    <line x1="35" y1="125" x2="10" y2="100"/>
    <!-- Top-left edge: (10,100) to (100,10). Crossings at (37,73) and (73,37) -->
    <line x1="10" y1="100" x2="35" y2="75"/>
    <line x1="39" y1="71" x2="71" y2="39"/>
    <line x1="75" y1="35" x2="100" y2="10"/>
  </g>

  <!-- SW monogram in deep teal, Cormorant Garamond, regular weight -->
  <text x="100" y="120" text-anchor="middle"
        font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif"
        font-size="60" font-weight="500"
        fill="#0E4F56">SW</text>
</svg>
